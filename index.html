<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>

</head>

<body>

    <div class="container">

        <div class="logo">🔗</div>

        <h1>URL Shortener</h1>

        <p class="subtitle">
            Turn long URLs into short and shareable links
        </p>

        <div class="input-box">

            <input
                type="text"
                id="urlInput"
                placeholder="https://example.com/very-long-url"
            >

            <button
                class="shorten-btn"
                onclick="shortenURL()"
            >
                Shorten
            </button>

        </div>

        <div id="error" class="message error"></div>

        <div id="loading" class="loading">
            Creating your short URL...
        </div>

        <div id="result" class="result">

            <div class="result-title">
                Your shortened URL
            </div>

            <div class="short-url">

                <div id="shortUrl"></div>

                <button
                    class="copy-btn"
                    onclick="copyURL()"
                    id="copyButton"
                >
                    Copy
                </button>

            </div>

        </div>

        <div class="history" id="history">

            <h3>Recent URLs</h3>

        </div>

    </div>


</body>
</html>
