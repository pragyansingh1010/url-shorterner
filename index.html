<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 500px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 10px 0 30px;
        }

        .input-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        .shorten-btn {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .shorten-btn:hover {
            background: #5568d8;
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
            display: none;
        }

        .error {
            color: #e53935;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #f5f6ff;
            border-radius: 10px;
        }

        .result-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .short-url {
            display: flex;
            gap: 10px;
        }

        #shortUrl {
            flex: 1;
            padding: 12px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 7px;
            color: #667eea;
            font-weight: bold;
            word-break: break-all;
        }

        .copy-btn {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: #444;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
        }

        .history {
            margin-top: 25px;
        }

        .history h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .history-item {
            padding: 10px;
            background: #f7f7f7;
            border-radius: 6px;
            margin-bottom: 7px;
            font-size: 13px;
            word-break: break-all;
        }

        @media (max-width: 550px) {
            .container {
                padding: 25px;
            }

            .input-box {
                flex-direction: column;
            }

            .shorten-btn {
                width: 100%;
            }

            .short-url {
                flex-direction: column;
            }

            .copy-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🔗</div>

        <h1>URL Shortener</h1>

        <p class="subtitle">
            Turn long URLs into short and shareable links
        </p>

        <div class="input-box">

            <input
                type="text"
                id="urlInput"
                placeholder="https://example.com/very-long-url"
            >

            <button
                class="shorten-btn"
                onclick="shortenURL()"
            >
                Shorten
            </button>

        </div>

        <div id="error" class="message error"></div>

        <div id="loading" class="loading">
            Creating your short URL...
        </div>

        <div id="result" class="result">

            <div class="result-title">
                Your shortened URL
            </div>

            <div class="short-url">

                <div id="shortUrl"></div>

                <button
                    class="copy-btn"
                    onclick="copyURL()"
                    id="copyButton"
                >
                    Copy
                </button>

            </div>

        </div>

        <div class="history" id="history">

            <h3>Recent URLs</h3>

        </div>

    </div>

    
    <script>
        let historyList =
            JSON.parse(localStorage.getItem("urlHistory")) || [];

        displayHistory();

        async function shortenURL() {

            let input =
                document.getElementById("urlInput");

            let url = input.value.trim();

            let error =
                document.getElementById("error");

            let result =
                document.getElementById("result");

            let loading =
                document.getElementById("loading");

            error.style.display = "none";
            result.style.display = "none";

            if (url === "") {
                showError("Please enter a URL.");
                return;
            }

            try {
                new URL(url);
            }
            catch {
                showError("Please enter a valid URL.");
                return;
            }

            loading.style.display = "block";

            try {

                let response = await fetch(
                    "https://is.gd/create.php?format=json&url=" +
                    encodeURIComponent(url)
                );

                let data = await response.json();

                loading.style.display = "none";

                if (data.shorturl) {

                    document.getElementById("shortUrl")
                        .textContent = data.shorturl;

                    result.style.display = "block";

                    historyList.unshift({
                        original: url,
                        short: data.shorturl
                    });

                    historyList =
                        historyList.slice(0, 5);

                    localStorage.setItem(
                        "urlHistory",
                        JSON.stringify(historyList)
                    );

                    displayHistory();

                }
                else {
                    showError(
                        "Unable to shorten this URL."
                    );
                }

            }
            catch {

                loading.style.display = "none";

                showError(
                    "Something went wrong. Please try again."
                );
            }
        }

        function showError(message) {

            let error =
                document.getElementById("error");

            error.textContent = message;
            error.style.display = "block";
        }

        function copyURL() {

            let url =
                document.getElementById("shortUrl")
                    .textContent;

            navigator.clipboard.writeText(url);

            let button =
                document.getElementById("copyButton");

            button.textContent = "Copied!";

            setTimeout(function() {
                button.textContent = "Copy";
            }, 1500);
        }

        function displayHistory() {

            let history =
                document.getElementById("history");

            history.innerHTML = "<h3>Recent URLs</h3>";

            historyList.forEach(function(item) {

                let div =
                    document.createElement("div");

                div.className = "history-item";

                div.innerHTML =
                    "<b>" +
                    item.short +
                    "</b><br>" +
                    item.original;

                history.appendChild(div);
            });
        }

        document
            .getElementById("urlInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    shortenURL();
                }

            });
    </script>

</body>
</html>
